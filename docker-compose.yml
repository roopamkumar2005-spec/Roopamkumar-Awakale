version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: dock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dockuser
      POSTGRES_PASSWORD: dockpass
      POSTGRES_DB: smart_dock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockuser -d smart_dock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dock_network

  redis:
    image: redis:7-alpine
    container_name: dock_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dock_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dock_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dockuser:dockpass@postgres:5432/smart_dock
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dock_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dock_frontend
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "0"
      REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - dock_network

volumes:
  postgres_data:

networks:
  dock_network:
    driver: bridge
